name: daftar

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DAFTAR_API_INTERNAL_URL: ${DAFTAR_API_INTERNAL_URL}
    environment:
      DAFTAR_API_INTERNAL_URL: ${DAFTAR_API_INTERNAL_URL}
    ports:
      - "${DAFTAR_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${DAFTAR_ENV_FILE:-.env}
    ports:
      - "${DAFTAR_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/daftar-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
