name: daftar

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        DAFTAR_API_INTERNAL_URL: ${DAFTAR_API_INTERNAL_URL}
    environment:
      DAFTAR_API_INTERNAL_URL: ${DAFTAR_API_INTERNAL_URL}
    ports:
      - "${DAFTAR_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${DAFTAR_ENV_FILE:-.env}
    ports:
      - "${DAFTAR_API_PORT:-8080}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/daftar-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${DAFTAR_MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (error) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongodb:27017\"}]}).ok }' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  mongodb_data:
